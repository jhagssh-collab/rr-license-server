<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RR License Admin</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #181818; color: #e8e8e8; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .sub { color: #999; font-size: 12px; margin-bottom: 20px; }
  input, button { font-family: inherit; font-size: 13px; padding: 8px 10px; border-radius: 6px; border: 1px solid #444; background: #242424; color: #e8e8e8; }
  button { cursor: pointer; background: #3b82f6; border: none; color: white; font-weight: 600; }
  button:hover { background: #2563eb; }
  button.danger { background: #ff5252; }
  button.danger:hover { background: #e03e3e; }
  button.secondary { background: #333; }
  button.secondary:hover { background: #404040; }
  .row { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #333; }
  th { color: #999; font-weight: 600; }
  .status { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .status.unused { background: #333; color: #ccc; }
  .status.active { background: #1e4620; color: #4ade80; }
  .status.revoked { background: #4a1e1e; color: #ff8080; }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  #gate { max-width: 360px; margin: 80px auto; }
  #panel { display: none; }
  .msg { font-size: 12px; margin-top: 8px; }
  .msg.err { color: #ff8080; }
  .msg.ok { color: #4ade80; }
</style>
</head>
<body>

<div id="gate">
  <h1>RR License Admin</h1>
  <div class="sub">Enter your ADMIN_SECRET to continue.</div>
  <div class="row">
    <input id="secretInput" type="password" placeholder="Admin secret" style="flex:1" />
    <button onclick="unlock()">Unlock</button>
  </div>
  <div id="gateMsg" class="msg"></div>
</div>

<div id="panel">
  <h1>RR License Admin</h1>
  <div class="sub">Generate and manage license keys for REHMAN RAJPUT Video Editor.</div>

  <div class="row">
    <input id="noteInput" type="text" placeholder="Customer name / email (optional note)" style="flex:1" />
    <button onclick="createKey()">+ Generate New Key</button>
    <button class="secondary" onclick="loadKeys()">Refresh</button>
  </div>
  <div id="createMsg" class="msg"></div>

  <table>
    <thead>
      <tr><th>License Key</th><th>Status</th><th>Device</th><th>Note</th><th>Created</th><th>Actions</th></tr>
    </thead>
    <tbody id="keysBody"><tr><td colspan="6">Loading…</td></tr></tbody>
  </table>
</div>

<script>
let ADMIN_SECRET = '';

function unlock() {
  ADMIN_SECRET = document.getElementById('secretInput').value.trim();
  if (!ADMIN_SECRET) return;
  loadKeys(true);
}

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'x-admin-secret': ADMIN_SECRET, 'Content-Type': 'application/json' }, opts.headers || {});
  const res = await fetch(path, opts);
  if (res.status === 401) throw new Error('Wrong admin secret');
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || ('HTTP ' + res.status));
  }
  return res.json();
}

async function loadKeys(firstUnlock) {
  const gateMsg = document.getElementById('gateMsg');
  try {
    const keys = await api('/admin/keys');
    if (firstUnlock) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
    }
    renderKeys(keys);
  } catch (e) {
    if (firstUnlock) { gateMsg.textContent = e.message; gateMsg.className = 'msg err'; }
    else alert('Failed to load: ' + e.message);
  }
}

function renderKeys(keys) {
  const body = document.getElementById('keysBody');
  if (!keys.length) { body.innerHTML = '<tr><td colspan="6">No keys yet. Generate one above.</td></tr>'; return; }
  body.innerHTML = keys.map(k => `
    <tr>
      <td class="mono">${k.licenseKey}</td>
      <td><span class="status ${k.status}">${k.status}${k.transferRequested ? ' · transfer requested' : ''}</span></td>
      <td class="mono">${k.deviceId ? k.deviceId.slice(0, 16) + '…' : '—'}</td>
      <td>${escapeHtml(k.note || '')}</td>
      <td>${new Date(k.createdAt).toLocaleDateString()}</td>
      <td>
        ${k.status !== 'revoked' ? `<button class="danger" onclick="revoke('${k.licenseKey}')">Revoke</button>` : ''}
        ${k.transferRequested || k.status === 'active' ? `<button class="secondary" onclick="approveTransfer('${k.licenseKey}')">Approve transfer / unbind</button>` : ''}
      </td>
    </tr>
  `).join('');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function createKey() {
  const note = document.getElementById('noteInput').value.trim();
  const msg = document.getElementById('createMsg');
  try {
    const rec = await api('/admin/keys', { method: 'POST', body: JSON.stringify({ note }) });
    msg.className = 'msg ok';
    msg.textContent = 'Created: ' + rec.licenseKey + ' — copy this and send it to the customer.';
    document.getElementById('noteInput').value = '';
    loadKeys();
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = e.message;
  }
}

async function revoke(key) {
  if (!confirm('Revoke ' + key + '? The app will stop working next time it needs to re-validate.')) return;
  await api('/admin/keys/' + encodeURIComponent(key) + '/revoke', { method: 'POST' });
  loadKeys();
}

async function approveTransfer(key) {
  if (!confirm('Unbind ' + key + ' from its current device? Customer can then activate it on a new PC.')) return;
  await api('/admin/keys/' + encodeURIComponent(key) + '/approve-transfer', { method: 'POST' });
  loadKeys();
}
</script>
</body>
</html>
